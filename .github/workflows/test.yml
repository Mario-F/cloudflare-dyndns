name: testing

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - '1.26'
          - '1.27'
    name: Go ${{ matrix.go }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make test
